spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lowerCaseServiceId: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: unrestricted
info:
  app:
    name: "gatewayserver"
    description: Easy bank gateway server application
    version: 1.0

logging:
  level:
    com:
      easybytes:
        gatewayserver: DEBUG